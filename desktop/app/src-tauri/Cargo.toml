[package]
name = "ai-lifeos-desktop"
version = "0.1.0"
description = "AI-LifeOS Chat GUI MVP"
authors = ["AI-LifeOS"]
edition = "2021"

[lib]
name = "ai_lifeos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
